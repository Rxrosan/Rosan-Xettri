<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Rosan KC</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }
        .container {
            width: 100%;
            max-width: 800px;
            border: 1px solid #00ff00;
            padding: 20px;
        }
        h1 {
            color: #ff5555;
            text-align: center;
        }
        .terminal {
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 15px;
        }
        #output {
            height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .command-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            margin-right: 10px;
        }
        #input {
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            width: 100%;
            outline: none;
            flex-grow: 1;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: #00ff00;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        .help-option {
            color: #00ffff;
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title"></h1>
        <p id="message"></p>
        
        <div class="terminal">
            <div id="output"></div>
            <div class="command-line">
                <span class="prompt">RX2061
                <input type="text" id="input" autofocus>
                
            </div>
        </div>
    </div>

    <script>
        // Auto-writing effect
        function typeWriter(element, text, speed, callback) {
            let i = 0;
            function typing() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typing, speed);
                } else if (callback) {
                    callback();
                }
            }
            typing();
        }

        // Initialize elements
        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const output = document.getElementById('output');
        const input = document.getElementById('input');

        // Type the header and message
        typeWriter(title, "Rosan Xettri 404 - Page Not Found", 100, () => {
            typeWriter(message, "The page you're looking for doesn't exist or has been moved.", 50, () => {
                typeWriter(output, "", 30, initializeTerminal);
            });
        });

        function initializeTerminal() {
            typeWriter(output, "", 30, () => {
                typeWriter(output, "Type 'help' for options.\n", 30, () => {
                    // Now make the input functional
                    setupTerminal();
                });
            });
        }

        // Available commands
        const commands = {
            help: showHelp,
            home: goHome,
            contact: showContact,
        };

        // Contact options
        const contacts = {
            facebook: "https://facebook.com/Rosan.2061",
            email: "mailto:rkc242855@gmail.com",
            website: "https://rosankc.com.np"
        };

        function setupTerminal() {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const cmd = this.value.trim().toLowerCase();
                    addOutput("→ " + cmd);
                    
                    if (cmd in commands) {
                        commands[cmd]();
                    } 
                    else if (cmd in contacts) {
                        addOutput(`Opening ${cmd}...`);
                        setTimeout(() => {
                            window.open(contacts[cmd], '_blank');
                        }, 500);
                    }
                    else {
                        addOutput(`Command not found: ${cmd}`);
                        addOutput("Type 'help' for available commands");
                    }
                    
                    this.value = '';
                    output.scrollTop = output.scrollHeight;
                }
            });
        }

        function addOutput(text) {
            const newLine = document.createElement('div');
            output.appendChild(newLine);
            typeWriter(newLine, text, 10);
        }

        function showHelp() {
            addOutput("Available commands:");
            addOutput("help - Show this help");
            addOutput("home - Go to homepage");
            addOutput("contact- Contact options");
        }

        function goHome() {
            addOutput("Redirecting to homepage...");
            setTimeout(() => {
                window.location.href = "https://rosankc.com.np";
            }, 1000);
        }

        function showContact() {
            addOutput("Available contact methods:");
            addOutput("facebook - Contact on Facebook");
            addOutput("email - Send an email");
            addOutput("website - Visit website");
            addOutput("Type one of these options to proceed");
        }

    </script>
</body>
</html>
