<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" type="image/png" href="asset/img/logo/RX2061.png">
    <title>RX |Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2980b9;
            --background-color: #f5f7fa;
            --card-color: #ffffff;
            --text-color: #333333;
            --text-light: #777777;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .weather-card {
            background-color: var(--card-color);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            padding: 25px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .location {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .date-time {
            color: var(--text-light);
            margin-bottom: 20px;
            font-size: 14px;
        }

        .weather-main {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .temperature {
            font-size: 72px;
            font-weight: bold;
            margin-right: 20px;
        }

        .weather-icon {
            font-size: 60px;
            margin-right: 20px;
        }

        .weather-desc {
            font-size: 18px;
            text-transform: capitalize;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-item {
            display: flex;
            align-items: center;
        }

        .detail-item i {
            margin-right: 10px;
            color: var(--primary-color);
            font-size: 20px;
        }

        .forecast-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
        }

        .forecast-item {
            min-width: 100px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        .forecast-item i {
            font-size: 30px;
            margin: 10px 0;
            display: block;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        .weather-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .moon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background-color: #f5f5dc;
            border-radius: 50%;
            box-shadow: 0 0 10px #f5f5dc;
        }

        .cloud {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }

        .lightning {
            position: absolute;
            width: 3px;
            height: 20px;
            background-color: yellow;
            opacity: 0;
        }

        .offline-notification {
            background-color: #e74c3c;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .install-prompt {
            background-color: #2ecc71;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
        }

        .install-prompt button {
            background-color: white;
            color: #2ecc71;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        @keyframes float {
            0% { transform: translateX(0); }
            50% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }
        
        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        
        @keyframes lightning {
            0%, 100% { opacity: 0; }
            5%, 10%, 15% { opacity: 1; }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .wi-refresh.wi-spin {
            animation: spin 1s infinite linear;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .weather-main {
                flex-direction: column;
                text-align: center;
            }
            
            .temperature {
                font-size: 60px;
                margin-right: 0;
            }
            
            .weather-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="offlineNotification" class="offline-notification">
            You are currently offline. Showing cached weather data.
        </div>
        
        <div id="installPrompt" class="install-prompt">
            <span>Install this app for a better experience</span>
            <div>
                <button id="dismissInstall">Dismiss</button>
                <button id="installBtn">Install</button>
            </div>
        </div>
        
        <div class="weather-card">
            <div id="weather-animation" class="weather-animation"></div>
            
            <div class="location" id="location">Loading...</div>
            <div class="date-time" id="date-time"></div>
            
            <div class="weather-main">
                <div class="temperature" id="temp">--</div>
                <div>
                    <i id="weather-icon" class="wi wi-day-sunny weather-icon"></i>
                    <div class="weather-desc" id="weather-desc">Loading weather...</div>
                </div>
            </div>
            
            <div class="weather-details">
                <div class="detail-item">
                    <i class="wi wi-humidity"></i>
                    <div>Humidity: <span id="humidity">--</span></div>
                </div>
                <div class="detail-item">
                    <i class="wi wi-strong-wind"></i>
                    <div>Wind: <span id="wind">--</span></div>
                </div>
                <div class="detail-item">
                    <i class="wi wi-barometer"></i>
                    <div>Pressure: <span id="pressure">--</span></div>
                </div>
                <div class="detail-item">
                    <i class="wi wi-raindrop"></i>
                    <div>Rain: <span id="rain">--</span></div>
                </div>
                <div class="detail-item">
                    <i class="wi wi-day-sunny"></i>
                    <div>UV Index: <span id="uv">--</span></div>
                </div>
                <div class="detail-item">
                    <i class="wi wi-eye"></i>
                    <div>Visibility: <span id="visibility">--</span></div>
                </div>
                <div class="detail-item">
                    <i class="wi wi-sunrise"></i>
                    <div>Sunrise: <span id="sunrise-time">--:--</span></div>
                </div>
                <div class="detail-item">
                    <i class="wi wi-sunset"></i>
                    <div>Sunset: <span id="sunset-time">--:--</span></div>
                </div>
                <div class="detail-item">
                    <i class="wi wi-moon-new"></i>
                    <div>Moon: <span id="moon-phase">--</span></div>
                </div>
            </div>
            
            <div class="forecast-container" id="forecast-container">
                <!-- Forecast items will be added here dynamically -->
            </div>
            
            <div class="controls">
                <button id="updateLocationBtn">
                    <i class="wi wi-compass"></i> Change Location
                </button>
                <div>
                    <button id="refreshBtn">
                        <i class="wi wi-refresh"></i> Refresh
                    </button>
                    <button id="unitToggle">
                        <i class="wi wi-celsius"></i> Switch to °F
                    </button>
                    <button id="updateLocationBtn" onclick="window.location.href='index.html'"><i class="wi wi-direction-left"></i> Back to Home</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="locationModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Update Location</h2>
                <span id="closeModal" style="cursor: pointer; font-size: 24px;">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="cityInput">City</label>
                    <input type="text" id="cityInput" placeholder="Enter city name">
                </div>
                <div class="form-group">
                    <label for="countryInput">Country (optional)</label>
                    <input type="text" id="countryInput" placeholder="Enter country code (e.g., US)">
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelLocation">Cancel</button>
                <button id="submitLocation">Update</button>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const locationElement = document.getElementById('location');
            const dateTimeElement = document.getElementById('date-time');
            const tempElement = document.getElementById('temp');
            const tempUnitElement = document.getElementById('temp-unit');
            const weatherDescElement = document.getElementById('weather-desc');
            const humidityElement = document.getElementById('humidity');
            const windElement = document.getElementById('wind');
            const pressureElement = document.getElementById('pressure');
            const rainElement = document.getElementById('rain');
            const uvElement = document.getElementById('uv');
            const visibilityElement = document.getElementById('visibility');
            const sunriseElement = document.getElementById('sunrise-time');
            const sunsetElement = document.getElementById('sunset-time');
            const moonPhaseElement = document.getElementById('moon-phase');
            const weatherIcon = document.getElementById('weather-icon');
            const weatherAnimation = document.getElementById('weather-animation');
            const refreshBtn = document.getElementById('refreshBtn');
            const unitToggle = document.getElementById('unitToggle');
            const updateLocationBtn = document.getElementById('updateLocationBtn');
            const forecastContainer = document.getElementById('forecast-container');
            const offlineNotification = document.getElementById('offlineNotification');
            const installPrompt = document.getElementById('installPrompt');
            const installBtn = document.getElementById('installBtn');
            const dismissInstall = document.getElementById('dismissInstall');
            const locationModal = document.getElementById('locationModal');
            const closeModal = document.getElementById('closeModal');
            const cancelLocation = document.getElementById('cancelLocation');
            const submitLocation = document.getElementById('submitLocation');
            const cityInput = document.getElementById('cityInput');
            const countryInput = document.getElementById('countryInput');

            // State
            let isCelsius = true;
            let weatherData = null;
            let refreshInterval;
            let deferredPrompt = null;
            let lastKnownLocation = null;

            // Initialize
            updateDateTime();
            setInterval(updateDateTime, 1000);
            checkConnectivity();
            loadCachedWeather();
            setupInstallPrompt();
            checkStoredLocation();

            // Event Listeners
            unitToggle.addEventListener('click', toggleUnit);
            refreshBtn.addEventListener('click', manualRefresh);
            updateLocationBtn.addEventListener('click', showLocationModal);
            closeModal.addEventListener('click', hideLocationModal);
            cancelLocation.addEventListener('click', hideLocationModal);
            submitLocation.addEventListener('click', updateLocationManually);
            window.addEventListener('online', handleOnline);
            window.addEventListener('offline', handleOffline);
            installBtn.addEventListener('click', installApp);
            dismissInstall.addEventListener('click', () => {
                installPrompt.style.display = 'none';
                localStorage.setItem('installPromptDismissed', 'true');
            });

            // Functions
            function checkStoredLocation() {
                const storedLocation = localStorage.getItem('userLocation');
                if (storedLocation) {
                    try {
                        lastKnownLocation = JSON.parse(storedLocation);
                        if (lastKnownLocation.coords) {
                            getWeather(lastKnownLocation.coords.latitude, lastKnownLocation.coords.longitude);
                        } else if (lastKnownLocation.city) {
                            geocodeCity(lastKnownLocation.city, lastKnownLocation.country);
                        }
                    } catch (e) {
                        console.error('Error parsing stored location', e);
                        getLocation();
                    }
                } else {
                    getLocation();
                }
            }

            function setupInstallPrompt() {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    deferredPrompt = e;
                    
                    if (!localStorage.getItem('installPromptDismissed') && 
                        !window.matchMedia('(display-mode: standalone)').matches) {
                        installPrompt.style.display = 'flex';
                    }
                });
            }

            function installApp() {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            console.log('User accepted install');
                        } else {
                            console.log('User dismissed install');
                        }
                        deferredPrompt = null;
                        installPrompt.style.display = 'none';
                    });
                }
            }

            function checkConnectivity() {
                if (navigator.onLine) {
                    offlineNotification.style.display = 'none';
                } else {
                    handleOffline();
                }
            }

            function handleOnline() {
                offlineNotification.style.display = 'none';
                if (!weatherData) {
                    checkStoredLocation();
                }
            }

            function handleOffline() {
                offlineNotification.style.display = 'block';
                loadCachedWeather();
            }

            function loadCachedWeather() {
                const cachedWeather = localStorage.getItem('weatherData');
                if (cachedWeather) {
                    try {
                        weatherData = JSON.parse(cachedWeather);
                        updateWeatherDisplay(weatherData);
                    } catch (e) {
                        console.error('Error parsing cached weather data', e);
                    }
                }
            }

            function saveWeatherData(data) {
                try {
                    localStorage.setItem('weatherData', JSON.stringify(data));
                } catch (e) {
                    console.error('Error saving weather data', e);
                }
            }

            function saveLocation(location) {
                try {
                    localStorage.setItem('userLocation', JSON.stringify(location));
                    lastKnownLocation = location;
                } catch (e) {
                    console.error('Error saving location', e);
                }
            }

            function showLocationModal() {
                locationModal.style.display = 'flex';
            }

            function hideLocationModal() {
                locationModal.style.display = 'none';
                cityInput.value = '';
                countryInput.value = '';
            }

            function updateLocationManually() {
                const city = cityInput.value.trim();
                const country = countryInput.value.trim();
                
                if (!city) {
                    alert('Please enter a city name');
                    return;
                }
                
                geocodeCity(city, country);
                hideLocationModal();
            }

            async function geocodeCity(city, country) {
                try {
                    const query = country ? `${city},${country}` : city;
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                    const data = await response.json();
                    
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        
                        saveLocation({
                            city: city,
                            country: country,
                            displayName: data[0].display_name
                        });
                        
                        getWeather(lat, lon);
                    } else {
                        alert('Location not found. Please try a different city name.');
                    }
                } catch (error) {
                    console.error('Error geocoding city:', error);
                    alert('Error finding location. Please try again.');
                }
            }

            function updateDateTime() {
                const now = new Date();
                const options = { 
                    weekday: 'long', 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                };
                dateTimeElement.textContent = now.toLocaleDateString('en-US', options);
            }
            
            function toggleUnit() {
                isCelsius = !isCelsius;
                unitToggle.innerHTML = isCelsius ? '<i class="wi wi-celsius"></i> Switch to °F' : '<i class="wi wi-fahrenheit"></i> Switch to °C';
                
                if (weatherData) {
                    updateWeatherDisplay(weatherData);
                }
            }
            
            function manualRefresh() {
                if (!navigator.onLine) {
                    offlineNotification.style.display = 'block';
                    return;
                }

                refreshBtn.innerHTML = '<i class="wi wi-refresh wi-spin"></i> Refreshing...';
                clearInterval(refreshInterval);
                
                if (lastKnownLocation) {
                    if (lastKnownLocation.coords) {
                        getWeather(lastKnownLocation.coords.latitude, lastKnownLocation.coords.longitude);
                    } else if (lastKnownLocation.city) {
                        geocodeCity(lastKnownLocation.city, lastKnownLocation.country);
                    }
                } else {
                    getLocation();
                }
                
                setTimeout(() => {
                    refreshBtn.innerHTML = '<i class="wi wi-refresh"></i> Refresh';
                    setupRefreshInterval();
                }, 2000);
            }
            
            function setupRefreshInterval() {
                refreshInterval = setInterval(() => {
                    if (navigator.onLine && lastKnownLocation) {
                        if (lastKnownLocation.coords) {
                            getWeather(lastKnownLocation.coords.latitude, lastKnownLocation.coords.longitude);
                        } else if (lastKnownLocation.city) {
                            geocodeCity(lastKnownLocation.city, lastKnownLocation.country);
                        }
                    }
                }, 15 * 60 * 1000);
            }
            
            function getLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        position => {
                            const { latitude, longitude } = position.coords;
                            
                            saveLocation({
                                coords: { latitude, longitude },
                                timestamp: position.timestamp
                            });
                            
                            getWeather(latitude, longitude);
                        },
                        error => {
                            console.error('Error getting location:', error);
                            locationElement.textContent = 'Unable to get location';
                            getWeather(40.7128, -74.0060); // Default to New York
                        },
                        { enableHighAccuracy: true, maximumAge: 0 }
                    );
                } else {
                    locationElement.textContent = 'Geolocation not supported';
                    getWeather(40.7128, -74.0060); // Default to New York
                }
            }
            
            async function getWeather(lat, lon) {
                try {
                    const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,relativehumidity_2m,windspeed_10m,weathercode&daily=weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto`);
                    
                    if (!response.ok) {
                        throw new Error('Weather data not available');
                    }
                    
                    const data = await response.json();
                    
                    let locationName = 'Unknown Location';
                    if (lastKnownLocation && lastKnownLocation.displayName) {
                        locationName = lastKnownLocation.displayName.split(',')[0];
                    } else {
                        locationName = await getLocationName(lat, lon);
                    }
                    
                    weatherData = {
                        location: locationName,
                        current: {
                            temp: data.current_weather.temperature,
                            humidity: data.hourly.relativehumidity_2m[0],
                            wind_speed: data.current_weather.windspeed,
                            pressure: 1015,
                            rain: 0,
                            uv: 0,
                            visibility: 10,
                            weather: [{
                                main: getWeatherMain(data.current_weather.weathercode),
                                description: getWeatherDescription(data.current_weather.weathercode)
                            }],
                            sunrise: new Date(data.daily.sunrise[0]).getTime() / 1000,
                            sunset: new Date(data.daily.sunset[0]).getTime() / 1000,
                            moon_phase: 0.5
                        },
                        daily: processForecastData(data.daily)
                    };
                    
                    saveWeatherData(weatherData);
                    updateWeatherDisplay(weatherData);
                } catch (error) {
                    console.error('Error fetching weather:', error);
                    locationElement.textContent = 'Error loading weather data';
                    loadCachedWeather();
                }
            }
            
            function processForecastData(dailyData) {
                const forecast = [];
                for (let i = 0; i < Math.min(5, dailyData.time.length); i++) {
                    forecast.push({
                        dt: new Date(dailyData.time[i]).getTime() / 1000,
                        temp: {
                            max: dailyData.temperature_2m_max[i],
                            min: dailyData.temperature_2m_min[i]
                        },
                        weather: [{
                            main: getWeatherMain(dailyData.weathercode[i])
                        }],
                        sunrise: new Date(dailyData.sunrise[i]).getTime() / 1000,
                        sunset: new Date(dailyData.sunset[i]).getTime() / 1000,
                        moon_phase: 0.5
                    });
                }
                return forecast;
            }
            
            async function getLocationName(lat, lon) {
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const data = await response.json();
                    return data.address.city || data.address.town || data.address.village || 
                           data.address.county || data.address.state || 'Unknown Location';
                } catch (error) {
                    console.error('Error fetching location name:', error);
                    return 'Unknown Location';
                }
            }
            
            function getWeatherMain(weatherCode) {
                if (weatherCode === 0) return 'Clear';
                if (weatherCode <= 3) return 'Clouds';
                if (weatherCode <= 49) return 'Fog';
                if (weatherCode <= 59) return 'Drizzle';
                if (weatherCode <= 69) return 'Rain';
                if (weatherCode <= 79) return 'Snow';
                if (weatherCode <= 84) return 'Rain';
                if (weatherCode <= 94) return 'Snow';
                if (weatherCode <= 99) return 'Thunderstorm';
                return 'Clear';
            }
            
            function getWeatherDescription(weatherCode) {
                const descriptions = {
                    0: 'Clear sky',
                    1: 'Mainly clear',
                    2: 'Partly cloudy',
                    3: 'Overcast',
                    45: 'Fog',
                    48: 'Freezing fog',
                    51: 'Light drizzle',
                    53: 'Moderate drizzle',
                    55: 'Dense drizzle',
                    56: 'Light freezing drizzle',
                    57: 'Dense freezing drizzle',
                    61: 'Slight rain',
                    63: 'Moderate rain',
                    65: 'Heavy rain',
                    66: 'Light freezing rain',
                    67: 'Heavy freezing rain',
                    71: 'Slight snow',
                    73: 'Moderate snow',
                    75: 'Heavy snow',
                    77: 'Snow grains',
                    80: 'Slight rain showers',
                    81: 'Moderate rain showers',
                    82: 'Violent rain showers',
                    85: 'Slight snow showers',
                    86: 'Heavy snow showers',
                    95: 'Thunderstorm',
                    96: 'Thunderstorm with slight hail',
                    99: 'Thunderstorm with heavy hail'
                };
                return descriptions[weatherCode] || 'Unknown';
            }
            
            function getMoonPhaseDescription(phase) {
                if (phase === 0 || phase === 1) return 'New Moon';
                if (phase < 0.25) return 'Waxing Crescent';
                if (phase === 0.25) return 'First Quarter';
                if (phase < 0.5) return 'Waxing Gibbous';
                if (phase === 0.5) return 'Full Moon';
                if (phase < 0.75) return 'Waning Gibbous';
                if (phase === 0.75) return 'Last Quarter';
                return 'Waning Crescent';
            }
            
            function updateWeatherDisplay(data) {
                if (!data) return;
                
                locationElement.textContent = data.location;
                
                const temp = isCelsius ? data.current.temp : (data.current.temp * 9/5) + 32;
                tempElement.textContent = Math.round(temp);
                
                weatherDescElement.textContent = data.current.weather[0].description;
                humidityElement.textContent = `${data.current.humidity}%`;
                windElement.textContent = `${data.current.wind_speed.toFixed(1)} m/s`;
                pressureElement.textContent = `${data.current.pressure} hPa`;
                rainElement.textContent = `${data.current.rain.toFixed(1)} mm`;
                uvElement.textContent = data.current.uv.toFixed(1);
                visibilityElement.textContent = `${data.current.visibility.toFixed(1)} km`;
                
                const sunriseTime = new Date(data.current.sunrise * 1000);
                const sunsetTime = new Date(data.current.sunset * 1000);
                sunriseElement.textContent = sunriseTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                sunsetElement.textContent = sunsetTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                moonPhaseElement.textContent = getMoonPhaseDescription(data.current.moon_phase);
                
                updateWeatherIcon(data.current.weather[0].main);
                updateWeatherAnimation(data.current.weather[0].main);
                updateForecast(data.daily);
            }
            
            function updateWeatherIcon(weatherMain) {
                const prefix = 'wi-night-';
                
                const iconMap = {
                    'Clear': 'clear',
                    'Clouds': 'cloudy',
                    'Rain': 'rain',
                    'Drizzle': 'showers',
                    'Thunderstorm': 'thunderstorm',
                    'Snow': 'snow',
                    'Fog': 'fog',
                    'Atmosphere': 'fog'
                };
                
                weatherIcon.className = `wi ${prefix}${iconMap[weatherMain] || 'clear'}`;
            }
            
            function updateWeatherAnimation(weatherMain) {
                weatherAnimation.innerHTML = '';
                
                for (let i = 0; i < 50; i++) {
                    const star = document.createElement('div');
                    star.style.position = 'absolute';
                    star.style.width = `${Math.random() * 2}px`;
                    star.style.height = star.style.width;
                    star.style.backgroundColor = 'white';
                    star.style.borderRadius = '50%';
                    star.style.top = `${Math.random() * 100}%`;
                    star.style.left = `${Math.random() * 100}%`;
                    star.style.opacity = Math.random();
                    weatherAnimation.appendChild(star);
                    
                    if (Math.random() > 0.7) {
                        star.style.animation = `twinkle ${1 + Math.random() * 2}s infinite alternate`;
                    }
                }
                
                if (weatherMain === 'Clear') {
                    const moon = document.createElement('div');
                    moon.className = 'moon';
                    weatherAnimation.appendChild(moon);
                } else if (weatherMain === 'Clouds') {
                    createClouds();
                }
                
                if (weatherMain === 'Thunderstorm') {
                    for (let i = 0; i < 3; i++) {
                        const lightning = document.createElement('div');
                        lightning.className = 'lightning';
                        lightning.style.left = `${20 + Math.random() * 60}%`;
                        lightning.style.top = `${10 + Math.random() * 30}%`;
                        lightning.style.animation = `lightning ${3 + Math.random() * 5}s infinite`;
                        weatherAnimation.appendChild(lightning);
                    }
                }
            }
            
            function createClouds() {
                for (let i = 0; i < 3; i++) {
                    const cloud = document.createElement('div');
                    cloud.className = 'cloud';
                    cloud.style.width = `${40 + Math.random() * 30}px`;
                    cloud.style.height = `${20 + Math.random() * 20}px`;
                    cloud.style.top = `${20 + Math.random() * 40}px`;
                    cloud.style.left = `${10 + Math.random() * 80}px`;
                    cloud.style.opacity = 0.5 + Math.random() * 0.3;
                    
                    cloud.style.animation = `float ${10 + Math.random() * 10}s linear infinite`;
                    if (i % 2 === 0) {
                        cloud.style.animationDirection = 'reverse';
                    }
                    
                    weatherAnimation.appendChild(cloud);
                }
            }
            
            function updateForecast(forecastData) {
                forecastContainer.innerHTML = '';
                
                forecastData.forEach(day => {
                    const forecastItem = document.createElement('div');
                    forecastItem.className = 'forecast-item';
                    
                    const date = new Date(day.dt * 1000);
                    const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                    
                    const iconMap = {
                        'Clear': 'wi-night-clear',
                        'Clouds': 'wi-night-cloudy',
                        'Rain': 'wi-rain',
                        'Drizzle': 'wi-showers',
                        'Thunderstorm': 'wi-thunderstorm',
                        'Snow': 'wi-snow',
                        'Fog': 'wi-fog',
                        'Atmosphere': 'wi-fog'
                    };
                    
                    const maxTemp = isCelsius ? day.temp.max : (day.temp.max * 9/5) + 32;
                    const minTemp = isCelsius ? day.temp.min : (day.temp.min * 9/5) + 32;
                    
                    forecastItem.innerHTML = `
                        <div>${dayName}</div>
                        <i class="wi ${iconMap[day.weather[0].main]}"></i>
                        <div>${Math.round(maxTemp)}° / ${Math.round(minTemp)}°</div>
                    `;
                    
                    forecastContainer.appendChild(forecastItem);
                });
            }
        });
    </script>
</body>
</html>
