<!DOCTYPE html>
<html lang="en">
<head>
     <script src="JS/DEV-TOOL-PROTECTION-2.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="icon" type="image/png" href="IMG/LOGO/RX-3.png">
    <title>RX |Daily Planner Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="CSS/CALANDER-STYLE.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="app-title">RX |Daily Planner</div>
            <div class="header-controls">
                <button id="view-events" class="header-button">
                    <span class="material-icons">event_note</span> My Events
                </button>
                <button class="header-button" onclick="window.location.href='https://www.rosankc.com.np';">
                    <i class="wi wi-direction-left"></i> Back to Home
                </button>
            </div>
        </header>

        <main class="calendar-container">
            <div class="calendar-controls">
                <button id="prev-month">
                    <span class="material-icons">chevron_left</span>
                </button>
                <h2 id="current-month">Month Year</h2>
                <button id="next-month">
                    <span class="material-icons">chevron_right</span>
                </button>
                <button id="today-btn">Today</button>
            </div>
            <div id="calendar" class="calendar"></div>
        </main>

        <!-- Event Modal -->
        <div id="event-modal" class="modal hidden">
            <div class="modal-content event-modal-large">
                <span class="close-btn">&times;</span>
                <h3 id="modal-title">Add Event</h3>
                <div class="form-row">
                    <input type="text" id="event-title" class="form-input" placeholder="Event title" required>
                    <select id="event-category" class="form-input">
                        <option value="general">General</option>
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="health">Health & Fitness</option>
                        <option value="family">Family</option>
                        <option value="social">Social</option>
                    </select>
                </div>
                
                <div class="form-row">
                    <input type="datetime-local" id="event-start" class="form-input">
                    <input type="datetime-local" id="event-end" class="form-input">
                </div>
                
                <textarea id="event-note" class="form-input" placeholder="Description"></textarea>
                
                <div class="recurrence-options">
                    <label><input type="checkbox" id="recurring-event"> Recurring Event</label>
                    <div id="recurrence-settings" class="hidden">
                        <select id="recurrence-type" class="form-input">
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                        <input type="number" id="recurrence-interval" class="form-input" min="1" value="1" placeholder="Repeat every...">
                        <input type="date" id="recurrence-end-date" class="form-input" placeholder="End date (optional)">
                    </div>
                </div>
                
                <div class="form-actions">
                    <button id="save-event" class="save-btn">Save</button>
                    <button id="delete-event" class="delete-btn hidden">Delete</button>
                </div>
            </div>
        </div>

        <!-- Events List Modal -->
        <div id="events-list-modal" class="modal hidden">
            <div class="modal-content events-modal">
                <span class="close-btn">&times;</span>
                <h2>My Events</h2>
                <div class="event-filters">
                    <select id="event-filter-category" class="form-input">
                        <option value="all">All Categories</option>
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="health">Health & Fitness</option>
                        <option value="family">Family</option>
                        <option value="social">Social</option>
                    </select>
                    <input type="date" id="event-filter-date" class="form-input">
                </div>
                <div id="events-list" class="events-list">
                    <!-- Events will be listed here -->
                </div>
            </div>
        </div>
    </div>

    <script src="JS/CALANDER-STYLE.js"></script>
</body>
</html>
