<!DOCTYPE html>
<html lang="en">
<head>
    <script src="JS/DEV-TOOL-PROTECTION-2.js"></script>
    <script src="JS/RX-Protect.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="IMG/LOGO/RX-3.png">
    <title>RX |Real-Time Weather</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
    <!-- Add Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2980b9;
            --background-color: #f5f7fa;
            --card-color: #ffffff;
            --text-color: #333333;
            --text-light: #777777;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --border-color: #e0e0e0;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
        }

        [data-theme="dark"] {
            --primary-color: #3a86ff;
            --secondary-color: #2667cc;
            --background-color: #121212;
            --card-color: #1e1e1e;
            --text-color: #f5f5f5;
            --text-light: #aaaaaa;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --border-color: #333333;
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .app-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
        }

        .weather-card {
            background-color: var(--card-color);
            border-radius: 15px;
            box-shadow: 0 10px 20px var(--shadow-color);
            padding: 25px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s, box-shadow 0.3s;
            border: 1px solid var(--border-color);
        }

        .location {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .date-time {
            color: var(--text-light);
            margin-bottom: 20px;
            font-size: 14px;
        }

        .weather-main {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .temperature {
            font-size: 72px;
            font-weight: bold;
            margin-right: 20px;
            position: relative;
        }

        .temp-unit {
            position: absolute;
            top: 10px;
            right: -15px;
            font-size: 24px;
            opacity: 0.7;
        }

        .weather-icon {
            font-size: 60px;
            margin-right: 20px;
        }

        .weather-desc {
            font-size: 18px;
            text-transform: capitalize;
        }

        .feels-like {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 5px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        [data-theme="dark"] .detail-item {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .detail-item i {
            margin-right: 10px;
            color: var(--primary-color);
            font-size: 20px;
            min-width: 24px;
            text-align: center;
        }

        .detail-item .detail-value {
            font-weight: 600;
        }

        .detail-item .detail-label {
            font-size: 12px;
            color: var(--text-light);
            display: block;
        }

        .forecast-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) var(--background-color);
        }

        .forecast-container::-webkit-scrollbar {
            height: 8px;
        }

        .forecast-container::-webkit-scrollbar-track {
            background: var(--background-color);
            border-radius: 10px;
        }

        .forecast-container::-webkit-scrollbar-thumb {
            background-color: var(--primary-color);
            border-radius: 10px;
        }

        .forecast-item {
            min-width: 100px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.05);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px var(--shadow-color);
            transition: background-color 0.3s, transform 0.2s;
            flex-shrink: 0;
        }

        [data-theme="dark"] .forecast-item {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .forecast-item:hover {
            transform: translateY(-5px);
        }

        .forecast-item i {
            font-size: 30px;
            margin: 10px 0;
            display: block;
        }

        .forecast-day {
            font-weight: 600;
        }

        .forecast-temp {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .forecast-temp-max {
            font-weight: 600;
        }

        .forecast-temp-min {
            color: var(--text-light);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        button:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button i {
            font-size: 16px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .weather-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .moon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background-color: #f5f5dc;
            border-radius: 50%;
            box-shadow: 0 0 10px #f5f5dc;
        }

        .cloud {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }

        .rain {
            position: absolute;
            width: 2px;
            height: 10px;
            background-color: rgba(200, 200, 255, 0.7);
            border-radius: 1px;
        }

        .snow {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: white;
            border-radius: 50%;
            opacity: 0.8;
        }

        .lightning {
            position: absolute;
            width: 3px;
            height: 20px;
            background-color: yellow;
            opacity: 0;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
        }

        .offline-notification {
            background-color: var(--danger-color);
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.5s;
        }

        .install-prompt {
            background-color: var(--success-color);
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s;
        }

        .install-prompt button {
            background-color: white;
            color: var(--success-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background-color: var(--card-color);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .modal-header h2 {
            margin: 0;
            color: var(--primary-color);
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--text-color);
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: border-color 0.3s, background-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-light);
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: var(--danger-color);
        }

        .hourly-forecast {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 0;
            margin-bottom: 20px;
        }

        .hourly-item {
            min-width: 60px;
            text-align: center;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            flex-shrink: 0;
            transition: background-color 0.3s;
        }

        [data-theme="dark"] .hourly-item {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .hourly-time {
            font-size: 12px;
            color: var(--text-light);
        }

        .hourly-temp {
            font-weight: 600;
            margin: 5px 0;
        }

        .hourly-icon {
            font-size: 20px;
            margin: 5px 0;
        }

        .tab-container {
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .tab {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            border-bottom: 2px solid var(--primary-color);
            color: var(--primary-color);
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .weather-map {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .loading {
            display: inline-block;
            animation: spin 1s infinite linear;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes float {
            0% { transform: translateX(0); }
            50% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }
        
        @keyframes twinkle {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        
        @keyframes lightning {
            0%, 100% { opacity: 0; }
            5%, 10%, 15% { opacity: 1; }
        }

        @keyframes rain {
            0% { transform: translateY(-10px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100px); opacity: 0; }
        }

        @keyframes snow {
            0% { transform: translateY(-10px) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100px) translateX(20px); opacity: 0; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .wi-refresh.wi-spin {
            animation: spin 1s infinite linear;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .weather-main {
                flex-direction: column;
                text-align: center;
            }
            
            .temperature {
                font-size: 60px;
                margin-right: 0;
                margin-bottom: 10px;
            }
            
            .weather-details {
                grid-template-columns: 1fr 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .button-group {
                justify-content: space-between;
                width: 100%;
            }

            .weather-map {
                height: 300px;
            }
        }

        @media (max-width: 480px) {
            .weather-details {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 10px;
            }

            .weather-card {
                padding: 15px;
            }

            .temperature {
                font-size: 48px;
            }

            .weather-icon {
                font-size: 40px;
            }

            .weather-map {
                height: 250px;
            }
        }

        /* Leaflet map adjustments for dark theme */
        [data-theme="dark"] .leaflet-tile {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
        }

        [data-theme="dark"] .leaflet-container {
            background: var(--card-color);
        }

        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: var(--card-color);
            color: var(--text-color);
            box-shadow: 0 3px 14px rgba(0,0,0,0.4);
        }

        .leaflet-container a.leaflet-popup-close-button {
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="app-title">Real-Time Weather</div>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                <i class="wi wi-day-sunny"></i>
            </button>
        </header>
        
        <div id="offlineNotification" class="offline-notification">
            You are currently offline. Showing cached weather data.
        </div>
        
        <div id="installPrompt" class="install-prompt">
            <span>Install this app for a better experience</span>
            <div>
                <button id="dismissInstall">Dismiss</button>
                <button id="installBtn">Install</button>
            </div>
        </div>
        
        <div class="weather-card">
            <div id="weather-animation" class="weather-animation"></div>
            
            <div class="location" id="location">Loading...</div>
            <div class="date-time" id="date-time"></div>
            
            <div class="weather-main">
                <div class="temperature" id="temp">--
                    <span class="temp-unit" id="temp-unit">°C</span>
                </div>
                <div>
                    <i id="weather-icon" class="wi wi-day-sunny weather-icon"></i>
                    <div class="weather-desc" id="weather-desc">Loading weather...</div>
                    <div class="feels-like">Feels like: <span id="feels-like">--</span></div>
                </div>
            </div>

            <div class="tab-container">
                <div class="tabs">
                    <div class="tab active" data-tab="current">Current</div>
                    <div class="tab" data-tab="hourly">Hourly</div>
                    <div class="tab" data-tab="map">Map</div>
                </div>
                
                <div class="tab-content active" id="current-tab">
                    <div class="weather-details">
                        <div class="detail-item">
                            <i class="wi wi-humidity"></i>
                            <div>
                                <span class="detail-value" id="humidity">--</span>
                                <span class="detail-label">Humidity</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="wi wi-strong-wind"></i>
                            <div>
                                <span class="detail-value" id="wind">--</span>
                                <span class="detail-label">Wind Speed</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="wi wi-raindrop"></i>
                            <div>
                                <span class="detail-value" id="rain">--</span>
                                <span class="detail-label">Precipitation</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="wi wi-sunrise"></i>
                            <div>
                                <span class="detail-value" id="sunrise-time">--:--</span>
                                <span class="detail-label">Sunrise</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="wi wi-sunset"></i>
                            <div>
                                <span class="detail-value" id="sunset-time">--:--</span>
                                <span class="detail-label">Sunset</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="tab-content" id="hourly-tab">
                    <div class="hourly-forecast" id="hourly-forecast">
                        <!-- Hourly forecast items will be added here dynamically -->
                    </div>
                </div>
                
                <div class="tab-content" id="map-tab">
                    <div id="weather-map" class="weather-map"></div>
                </div>
            </div>
            
            <h3>5-Day Forecast</h3>
            <div class="forecast-container" id="forecast-container">
                <!-- Forecast items will be added here dynamically -->
            </div>
            
            <div class="controls">
                <button id="updateLocationBtn">
                    <i class="wi wi-compass"></i> Change Location
                </button>
                <div class="button-group">
                    <button id="refreshBtn">
                        <i class="wi wi-refresh"></i> Refresh
                    </button>
                    <button id="unitToggle">
                        <i class="wi wi-celsius"></i> Convert To °F
                    </button>
                    <button type="button" onclick="window.location.href='http://www.rosankc.com.np';">
                        <i class="fas fa-arrow-left"></i> Back to Home
                    </button>
                    
                </div>
            </div>
        </div>
    </div>
    
    <div id="locationModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Update Location</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="cityInput">City</label>
                    <input type="text" id="cityInput" placeholder="Enter city name">
                </div>
                <div class="form-group">
                    <label for="countryInput">Country (optional)</label>
                    <input type="text" id="countryInput" placeholder="Enter country code (e.g., US)">
                </div>
                <div class="form-group">
                    <label>Or use current location</label>
                    <button id="useCurrentLocation" style="width: 100%;">
                        <i class="wi wi-compass"></i> Detect My Location
                    </button>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelLocation">Cancel</button>
                <button id="submitLocation">Update</button>
            </div>
        </div>
    </div>
    
    <!-- Add Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', function() {
    // DOM Elements
    const locationElement = document.getElementById('location');
    const dateTimeElement = document.getElementById('date-time');
    const tempElement = document.getElementById('temp');
    const tempUnitElement = document.getElementById('temp-unit');
    const weatherDescElement = document.getElementById('weather-desc');
    const feelsLikeElement = document.getElementById('feels-like');
    const humidityElement = document.getElementById('humidity');
    const windElement = document.getElementById('wind');
    const rainElement = document.getElementById('rain');
    const sunriseElement = document.getElementById('sunrise-time');
    const sunsetElement = document.getElementById('sunset-time');
    const weatherIcon = document.getElementById('weather-icon');
    const weatherAnimation = document.getElementById('weather-animation');
    const refreshBtn = document.getElementById('refreshBtn');
    const unitToggle = document.getElementById('unitToggle');
    const updateLocationBtn = document.getElementById('updateLocationBtn');
    const forecastContainer = document.getElementById('forecast-container');
    const hourlyForecastContainer = document.getElementById('hourly-forecast');
    const offlineNotification = document.getElementById('offlineNotification');
    const installPrompt = document.getElementById('installPrompt');
    const installBtn = document.getElementById('installBtn');
    const dismissInstall = document.getElementById('dismissInstall');
    const locationModal = document.getElementById('locationModal');
    const closeModal = document.getElementById('closeModal');
    const cancelLocation = document.getElementById('cancelLocation');
    const submitLocation = document.getElementById('submitLocation');
    const useCurrentLocation = document.getElementById('useCurrentLocation');
    const cityInput = document.getElementById('cityInput');
    const countryInput = document.getElementById('countryInput');
    const themeToggle = document.getElementById('themeToggle');
    const backToHome = document.getElementById('backToHome');
    const tabs = document.querySelectorAll('.tab');
    const tabContents = document.querySelectorAll('.tab-content');
    const weatherMap = document.getElementById('weather-map');

    // State
    let isCelsius = true;
    let weatherData = null;
    let refreshInterval;
    let deferredPrompt = null;
    let lastKnownLocation = null;
    let currentTheme = localStorage.getItem('theme') || 'light';
    let map = null;
    let marker = null;
    let circle = null;

    // Initialize
    setTheme(currentTheme);
    updateDateTime();
    setInterval(updateDateTime, 1000);
    checkConnectivity();
    loadCachedWeather();
    setupInstallPrompt();
    checkStoredLocation();
    setupTabNavigation();

    // Event Listeners
    unitToggle.addEventListener('click', toggleUnit);
    refreshBtn.addEventListener('click', manualRefresh);
    updateLocationBtn.addEventListener('click', showLocationModal);
    closeModal.addEventListener('click', hideLocationModal);
    cancelLocation.addEventListener('click', hideLocationModal);
    submitLocation.addEventListener('click', updateLocationManually);
    useCurrentLocation.addEventListener('click', useDeviceLocation);
    window.addEventListener('online', handleOnline);
    window.addEventListener('offline', handleOffline);
    installBtn.addEventListener('click', installApp);
    dismissInstall.addEventListener('click', () => {
        installPrompt.style.display = 'none';
        localStorage.setItem('installPromptDismissed', 'true');
    });
    themeToggle.addEventListener('click', toggleTheme);
    backToHome.addEventListener('click', () => {
        window.location.href = 'index.html';
    });

    // Functions
    function setupTabNavigation() {
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active class from all tabs and contents
                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));
                
                // Add active class to clicked tab and corresponding content
                tab.classList.add('active');
                const tabId = tab.getAttribute('data-tab');
                document.getElementById(`${tabId}-tab`).classList.add('active');
                
                // When map tab is activated, trigger a resize
                if (tabId === 'map' && map) {
                    setTimeout(() => {
                        map.invalidateSize();
                    }, 10);
                }
            });
        });
    }

    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        
        // Update theme toggle icon
        const themeIcon = theme === 'dark' ? 'wi-night-clear' : 'wi-day-sunny';
        themeToggle.innerHTML = `<i class="wi ${themeIcon}"></i>`;
        
        // Reinitialize map if it exists to apply theme changes
        if (map && weatherData) {
            const { latitude, longitude } = lastKnownLocation.coords || { latitude: 27.7172, longitude: 85.3240 };
            initMap(latitude, longitude);
        }
    }

    function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        setTheme(currentTheme);
    }

    function checkStoredLocation() {
        const storedLocation = localStorage.getItem('userLocation');
        if (storedLocation) {
            try {
                lastKnownLocation = JSON.parse(storedLocation);
                if (lastKnownLocation.coords) {
                    getWeather(lastKnownLocation.coords.latitude, lastKnownLocation.coords.longitude);
                } else if (lastKnownLocation.city) {
                    geocodeCity(lastKnownLocation.city, lastKnownLocation.country);
                }
            } catch (e) {
                console.error('Error parsing stored location', e);
                getLocation();
            }
        } else {
            getLocation();
        }
    }

    function setupInstallPrompt() {
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            if (!localStorage.getItem('installPromptDismissed') && 
                !window.matchMedia('(display-mode: standalone)').matches) {
                installPrompt.style.display = 'flex';
            }
        });
    }

    function installApp() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    console.log('User accepted install');
                } else {
                    console.log('User dismissed install');
                }
                deferredPrompt = null;
                installPrompt.style.display = 'none';
            });
        }
    }

    function checkConnectivity() {
        if (navigator.onLine) {
            offlineNotification.style.display = 'none';
        } else {
            handleOffline();
        }
    }

    function handleOnline() {
        offlineNotification.style.display = 'none';
        if (!weatherData) {
            checkStoredLocation();
        }
    }

    function handleOffline() {
        offlineNotification.style.display = 'block';
        loadCachedWeather();
    }

    function loadCachedWeather() {
        const cachedWeather = localStorage.getItem('weatherData');
        if (cachedWeather) {
            try {
                weatherData = JSON.parse(cachedWeather);
                updateWeatherDisplay(weatherData);
            } catch (e) {
                console.error('Error parsing cached weather data', e);
            }
        }
    }

    function saveWeatherData(data) {
        try {
            localStorage.setItem('weatherData', JSON.stringify(data));
        } catch (e) {
            console.error('Error saving weather data', e);
        }
    }

    function saveLocation(location) {
        try {
            localStorage.setItem('userLocation', JSON.stringify(location));
            lastKnownLocation = location;
        } catch (e) {
            console.error('Error saving location', e);
        }
    }

    function showLocationModal() {
        locationModal.style.display = 'flex';
        cityInput.focus();
    }

    function hideLocationModal() {
        locationModal.style.display = 'none';
        cityInput.value = '';
        countryInput.value = '';
    }

    function useDeviceLocation() {
        hideLocationModal();
        getLocation();
    }

    function updateLocationManually() {
        const city = cityInput.value.trim();
        const country = countryInput.value.trim();
        
        if (!city) {
            alert('Please enter a city name');
            return;
        }
        
        geocodeCity(city, country);
        hideLocationModal();
    }

    async function geocodeCity(city, country) {
        try {
            refreshBtn.innerHTML = '<i class="wi wi-refresh wi-spin"></i> Loading...';
            const query = country ? `${city},${country}` : city;
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
            const data = await response.json();
            
            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);
                
                saveLocation({
                    city: city,
                    country: country,
                    displayName: data[0].display_name
                });
                
                await getWeather(lat, lon);
            } else {
                alert('Location not found. Please try a different city name.');
            }
        } catch (error) {
            console.error('Error geocoding city:', error);
            alert('Error finding location. Please try again.');
        } finally {
            refreshBtn.innerHTML = '<i class="wi wi-refresh"></i> Refresh';
        }
    }

    function updateDateTime() {
        const now = new Date();
        const options = { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        };
        dateTimeElement.textContent = now.toLocaleDateString('en-US', options);
    }
    
    function toggleUnit() {
        isCelsius = !isCelsius;
        tempUnitElement.textContent = isCelsius ? '°C' : '°F';
        unitToggle.innerHTML = isCelsius 
            ? '<i class="wi wi-celsius"></i> Convert To °F' 
            : '<i class="wi wi-fahrenheit"></i> Convert To °C';
        
        if (weatherData) {
            updateWeatherDisplay(weatherData);
        }
    }
    
    function manualRefresh() {
        if (!navigator.onLine) {
            offlineNotification.style.display = 'block';
            return;
        }

        refreshBtn.innerHTML = '<i class="wi wi-refresh wi-spin"></i> Refreshing...';
        clearInterval(refreshInterval);
        
        if (lastKnownLocation) {
            if (lastKnownLocation.coords) {
                getWeather(lastKnownLocation.coords.latitude, lastKnownLocation.coords.longitude);
            } else if (lastKnownLocation.city) {
                geocodeCity(lastKnownLocation.city, lastKnownLocation.country);
            }
        } else {
            getLocation();
        }
        
        setTimeout(() => {
            refreshBtn.innerHTML = '<i class="wi wi-refresh"></i> Refresh';
            setupRefreshInterval();
        }, 2000);
    }
    
    function setupRefreshInterval() {
        refreshInterval = setInterval(() => {
            if (navigator.onLine && lastKnownLocation) {
                if (lastKnownLocation.coords) {
                    getWeather(lastKnownLocation.coords.latitude, lastKnownLocation.coords.longitude);
                } else if (lastKnownLocation.city) {
                    geocodeCity(lastKnownLocation.city, lastKnownLocation.country);
                }
            }
        }, 1 * 60 * 1000); // 1 minutes
    }
    
    function getLocation() {
        if (navigator.geolocation) {
            refreshBtn.innerHTML = '<i class="wi wi-refresh wi-spin"></i> Detecting...';
            navigator.geolocation.getCurrentPosition(
                async position => {
                    const { latitude, longitude } = position.coords;
                    
                    const locationName = await getLocationName(latitude, longitude);
                    
                    saveLocation({
                        coords: { latitude, longitude },
                        timestamp: position.timestamp,
                        displayName: locationName
                    });
                    
                    await getWeather(latitude, longitude);
                    refreshBtn.innerHTML = '<i class="wi wi-refresh"></i> Refresh';
                },
                error => {
                    console.error('Error getting location:', error);
                    locationElement.textContent = 'Unable to get location';
                    // Default to Kathmandu, Nepal if location access is denied
                    getWeather(27.7172, 85.3240);
                    refreshBtn.innerHTML = '<i class="wi wi-refresh"></i> Refresh';
                },
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        } else {
            locationElement.textContent = 'Geolocation not supported';
            // Default to Kathmandu, Nepal if geolocation is not supported
            getWeather(27.7172, 85.3240);
        }
    }
    
    function initMap(lat, lon) {
        if (map === null) {
            map = L.map('weather-map').setView([lat, lon], 10);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        } else {
            map.setView([lat, lon], 10);
        }

        // Remove existing marker and circle if they exist
        if (marker) map.removeLayer(marker);
        if (circle) map.removeLayer(circle);

        // Add new marker and circle
        marker = L.marker([lat, lon]).addTo(map)
            .bindPopup(`<b>${weatherData?.location || 'Current location'}</b><br>${lat.toFixed(4)}, ${lon.toFixed(4)}`)
            .openPopup();

        circle = L.circle([lat, lon], {
            color: 'var(--primary-color)',
            fillColor: 'var(--primary-color)',
            fillOpacity: 0.2,
            radius: 5000 // 5km radius
        }).addTo(map);
    }

    async function getWeather(lat, lon) {
        try {
            // Show loading state
            locationElement.textContent = 'Loading...';
            tempElement.textContent = '--';
            weatherDescElement.textContent = 'Loading weather data...';
            
            // Fetch weather data from Open-Meteo API
            const weatherResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,relativehumidity_2m,apparent_temperature,windspeed_10m,weathercode,precipitation&daily=weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto`);
            
            if (!weatherResponse.ok) {
                throw new Error('Weather data not available');
            }
            
            const weatherJson = await weatherResponse.json();
            
            // Process the data
            let locationName = 'Unknown Location';
            if (lastKnownLocation && lastKnownLocation.displayName) {
                locationName = lastKnownLocation.displayName.split(',')[0];
            } else {
                locationName = await getLocationName(lat, lon);
            }
            
            const currentHour = new Date().getHours();
            const processedData = {
                location: locationName,
                current: {
                    temp: weatherJson.current_weather.temperature,
                    feels_like: weatherJson.hourly.apparent_temperature[currentHour],
                    humidity: weatherJson.hourly.relativehumidity_2m[currentHour],
                    wind_speed: weatherJson.current_weather.windspeed,
                    rain: weatherJson.hourly.precipitation[currentHour],
                    weather: [{
                        main: getWeatherMain(weatherJson.current_weather.weathercode),
                        description: getWeatherDescription(weatherJson.current_weather.weathercode)
                    }],
                    sunrise: new Date(weatherJson.daily.sunrise[0]).getTime() / 1000,
                    sunset: new Date(weatherJson.daily.sunset[0]).getTime() / 1000
                },
                hourly: processHourlyData(weatherJson.hourly),
                daily: processForecastData(weatherJson.daily)
            };
            
            // Update the global weatherData variable
            weatherData = processedData;
            saveWeatherData(processedData);
            updateWeatherDisplay(processedData);
            
            // Initialize or update the map
            initMap(lat, lon);
        } catch (error) {
            console.error('Error fetching weather:', error);
            locationElement.textContent = 'Error loading weather data';
            loadCachedWeather();
        }
    }
    
    function processHourlyData(hourlyData) {
        const hourly = [];
        const now = new Date();
        const currentHour = now.getHours();
        
        // Get next 24 hours of data
        for (let i = 0; i < 24; i++) {
            const hourIndex = currentHour + i;
            if (hourIndex >= hourlyData.time.length) break;
            
            hourly.push({
                time: new Date(hourlyData.time[hourIndex]),
                temp: hourlyData.temperature_2m[hourIndex],
                feels_like: hourlyData.apparent_temperature[hourIndex],
                weather_code: hourlyData.weathercode[hourIndex],
                humidity: hourlyData.relativehumidity_2m[hourIndex],
                wind_speed: hourlyData.windspeed_10m[hourIndex],
                precipitation: hourlyData.precipitation[hourIndex]
            });
        }
        return hourly;
    }
    
    function processForecastData(dailyData) {
        const forecast = [];
        for (let i = 0; i < Math.min(5, dailyData.time.length); i++) {
            forecast.push({
                dt: new Date(dailyData.time[i]).getTime() / 1000,
                temp: {
                    max: dailyData.temperature_2m_max[i],
                    min: dailyData.temperature_2m_min[i]
                },
                weather: [{
                    main: getWeatherMain(dailyData.weathercode[i]),
                    description: getWeatherDescription(dailyData.weathercode[i])
                }],
                sunrise: new Date(dailyData.sunrise[i]).getTime() / 1000,
                sunset: new Date(dailyData.sunset[i]).getTime() / 1000
            });
        }
        return forecast;
    }
    
    async function getLocationName(lat, lon) {
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await response.json();
            return data.address.city || data.address.town || data.address.village || 
                   data.address.county || data.address.state || 'Unknown Location';
        } catch (error) {
            console.error('Error fetching location name:', error);
            return 'Unknown Location';
        }
    }
    
    function getWeatherMain(weatherCode) {
        if (weatherCode === 0) return 'Clear';
        if (weatherCode <= 3) return 'Clouds';
        if (weatherCode <= 49) return 'Fog';
        if (weatherCode <= 59) return 'Drizzle';
        if (weatherCode <= 69) return 'Rain';
        if (weatherCode <= 79) return 'Snow';
        if (weatherCode <= 84) return 'Rain';
        if (weatherCode <= 94) return 'Snow';
        if (weatherCode <= 99) return 'Thunderstorm';
        return 'Clear';
    }
    
    function getWeatherDescription(weatherCode) {
        const descriptions = {
            0: 'Clear sky',
            1: 'Mainly clear',
            2: 'Partly cloudy',
            3: 'Overcast',
            45: 'Fog',
            48: 'Freezing fog',
            51: 'Light drizzle',
            53: 'Moderate drizzle',
            55: 'Dense drizzle',
            56: 'Light freezing drizzle',
            57: 'Dense freezing drizzle',
            61: 'Slight rain',
            63: 'Moderate rain',
            65: 'Heavy rain',
            66: 'Light freezing rain',
            67: 'Heavy freezing rain',
            71: 'Slight snow',
            73: 'Moderate snow',
            75: 'Heavy snow',
            77: 'Snow grains',
            80: 'Slight rain showers',
            81: 'Moderate rain showers',
            82: 'Violent rain showers',
            85: 'Slight snow showers',
            86: 'Heavy snow showers',
            95: 'Thunderstorm',
            96: 'Thunderstorm with slight hail',
            99: 'Thunderstorm with heavy hail'
        };
        return descriptions[weatherCode] || 'Unknown';
    }
    
    function updateWeatherDisplay(data) {
        if (!data) return;
        
        locationElement.textContent = data.location;
        
        const temp = isCelsius ? data.current.temp : (data.current.temp * 9/5) + 32;
        const feelsLike = isCelsius ? data.current.feels_like : (data.current.feels_like * 9/5) + 32;
        
        tempElement.textContent = Math.round(temp);
        feelsLikeElement.textContent = `${Math.round(feelsLike)}°`;
        
        weatherDescElement.textContent = data.current.weather[0].description;
        humidityElement.textContent = `${data.current.humidity}%`;
        windElement.textContent = `${data.current.wind_speed.toFixed(1)} m/s`;
        rainElement.textContent = `${data.current.rain.toFixed(1)} mm`;
        
        const sunriseTime = new Date(data.current.sunrise * 1000);
        const sunsetTime = new Date(data.current.sunset * 1000);
        sunriseElement.textContent = sunriseTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        sunsetElement.textContent = sunsetTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        updateWeatherIcon(data.current.weather[0].main);
        updateWeatherAnimation(data.current.weather[0].main);
        updateHourlyForecast(data.hourly);
        updateForecast(data.daily);
    }
    
    function updateWeatherIcon(weatherMain) {
        const isDaytime = isCurrentlyDaytime();
        const prefix = isDaytime ? 'wi-day-' : 'wi-night-';
        
        const iconMap = {
            'Clear': 'clear',
            'Clouds': 'cloudy',
            'Rain': 'rain',
            'Drizzle': 'showers',
            'Thunderstorm': 'thunderstorm',
            'Snow': 'snow',
            'Fog': 'fog',
            'Atmosphere': 'fog'
        };
        
        weatherIcon.className = `wi ${prefix}${iconMap[weatherMain] || 'clear'}`;
    }
    
    function isCurrentlyDaytime() {
        if (!weatherData) return true;
        const now = new Date();
        const sunrise = new Date(weatherData.current.sunrise * 1000);
        const sunset = new Date(weatherData.current.sunset * 1000);
        return now > sunrise && now < sunset;
    }
    
    function updateWeatherAnimation(weatherMain) {
        weatherAnimation.innerHTML = '';
        
        // Create stars (for night or when it's clear)
        if (!isCurrentlyDaytime() || weatherMain === 'Clear') {
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = `${Math.random() * 2}px`;
                star.style.height = star.style.width;
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.opacity = Math.random();
                weatherAnimation.appendChild(star);
                
                if (Math.random() > 0.7) {
                    star.style.animation = `twinkle ${1 + Math.random() * 2}s infinite alternate`;
                }
            }
        }
        
        // Add moon at night
        if (!isCurrentlyDaytime()) {
            const moon = document.createElement('div');
            moon.className = 'moon';
            weatherAnimation.appendChild(moon);
        }
        
        // Weather-specific animations
        if (weatherMain === 'Clouds') {
            createClouds();
        } else if (weatherMain === 'Rain') {
            createRain();
        } else if (weatherMain === 'Thunderstorm') {
            createClouds();
            createRain();
            createLightning();
        } else if (weatherMain === 'Snow') {
            createSnow();
        } else if (weatherMain === 'Drizzle') {
            createDrizzle();
        }
    }
    
    function createClouds() {
        for (let i = 0; i < 5; i++) {
            const cloud = document.createElement('div');
            cloud.className = 'cloud';
            cloud.style.width = `${40 + Math.random() * 40}px`;
            cloud.style.height = `${20 + Math.random() * 20}px`;
            cloud.style.top = `${10 + Math.random() * 30}%`;
            cloud.style.left = `${Math.random() * 80}%`;
            cloud.style.opacity = 0.5 + Math.random() * 0.3;
            
            cloud.style.animation = `float ${15 + Math.random() * 15}s linear infinite`;
            if (i % 2 === 0) {
                cloud.style.animationDirection = 'reverse';
            }
            
            weatherAnimation.appendChild(cloud);
        }
    }
    
    function createRain() {
        for (let i = 0; i < 50; i++) {
            const drop = document.createElement('div');
            drop.className = 'rain';
            drop.style.left = `${Math.random() * 100}%`;
            drop.style.top = `${Math.random() * 100}%`;
            drop.style.opacity = 0.3 + Math.random() * 0.5;
            drop.style.animation = `rain ${0.5 + Math.random() * 0.5}s linear infinite`;
            drop.style.animationDelay = `${Math.random() * 0.5}s`;
            weatherAnimation.appendChild(drop);
        }
    }
    
    function createDrizzle() {
        for (let i = 0; i < 30; i++) {
            const drop = document.createElement('div');
            drop.className = 'rain';
            drop.style.left = `${Math.random() * 100}%`;
            drop.style.top = `${Math.random() * 100}%`;
            drop.style.opacity = 0.2 + Math.random() * 0.3;
            drop.style.width = '1px';
            drop.style.height = '5px';
            drop.style.animation = `rain ${1 + Math.random() * 0.5}s linear infinite`;
            drop.style.animationDelay = `${Math.random() * 0.5}s`;
            weatherAnimation.appendChild(drop);
        }
    }
    
    function createSnow() {
        for (let i = 0; i < 30; i++) {
            const flake = document.createElement('div');
            flake.className = 'snow';
            flake.style.left = `${Math.random() * 100}%`;
            flake.style.top = `${Math.random() * 100}%`;
            flake.style.width = `${3 + Math.random() * 3}px`;
            flake.style.height = flake.style.width;
            flake.style.animation = `snow ${5 + Math.random() * 5}s linear infinite`;
            flake.style.animationDelay = `${Math.random() * 2}s`;
            weatherAnimation.appendChild(flake);
        }
    }
    
    function createLightning() {
        for (let i = 0; i < 3; i++) {
            const lightning = document.createElement('div');
            lightning.className = 'lightning';
            lightning.style.left = `${20 + Math.random() * 60}%`;
            lightning.style.top = `${10 + Math.random() * 30}%`;
            lightning.style.width = `${2 + Math.random() * 3}px`;
            lightning.style.height = `${15 + Math.random() * 20}px`;
            lightning.style.animation = `lightning ${5 + Math.random() * 10}s infinite`;
            weatherAnimation.appendChild(lightning);
        }
    }
    
    function updateHourlyForecast(hourlyData) {
        hourlyForecastContainer.innerHTML = '';
        
        hourlyData.slice(0, 24).forEach(hour => {
            const hourlyItem = document.createElement('div');
            hourlyItem.className = 'hourly-item';
            
            const time = hour.time.toLocaleTimeString([], {hour: '2-digit'});
            const temp = isCelsius ? hour.temp : (hour.temp * 9/5) + 32;
            const weatherMain = getWeatherMain(hour.weather_code);
            
            const iconMap = {
                'Clear': isCurrentlyDaytime() ? 'wi-day-sunny' : 'wi-night-clear',
                'Clouds': isCurrentlyDaytime() ? 'wi-day-cloudy' : 'wi-night-cloudy',
                'Rain': 'wi-rain',
                'Drizzle': 'wi-showers',
                'Thunderstorm': 'wi-thunderstorm',
                'Snow': 'wi-snow',
                'Fog': 'wi-fog',
                'Atmosphere': 'wi-fog'
            };
            
            hourlyItem.innerHTML = `
                <div class="hourly-time">${time}</div>
                <div class="hourly-temp">${Math.round(temp)}°</div>
                <i class="wi ${iconMap[weatherMain]} hourly-icon"></i>
                <div class="hourly-precip">${hour.precipitation.toFixed(1)} mm</div>
            `;
            
            hourlyForecastContainer.appendChild(hourlyItem);
        });
    }
    
    function updateForecast(forecastData) {
        forecastContainer.innerHTML = '';
        
        forecastData.forEach(day => {
            const forecastItem = document.createElement('div');
            forecastItem.className = 'forecast-item';
            
            const date = new Date(day.dt * 1000);
            const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
            
            const weatherMain = day.weather[0].main;
            const iconMap = {
                'Clear': 'wi-day-sunny',
                'Clouds': 'wi-day-cloudy',
                'Rain': 'wi-rain',
                'Drizzle': 'wi-showers',
                'Thunderstorm': 'wi-thunderstorm',
                'Snow': 'wi-snow',
                'Fog': 'wi-fog',
                'Atmosphere': 'wi-fog'
            };
            
            const maxTemp = isCelsius ? day.temp.max : (day.temp.max * 9/5) + 32;
            const minTemp = isCelsius ? day.temp.min : (day.temp.min * 9/5) + 32;
            
            forecastItem.innerHTML = `
                <div class="forecast-day">${dayName}</div>
                <i class="wi ${iconMap[weatherMain]}"></i>
                <div class="forecast-temp">
                    <span class="forecast-temp-max">${Math.round(maxTemp)}°</span>
                    <span class="forecast-temp-min">${Math.round(minTemp)}°</span>
                </div>
                <div class="forecast-desc">${day.weather[0].description}</div>
            `;
            
            forecastContainer.appendChild(forecastItem);
        });
    }
});
    </script>
