<!DOCTYPE html>
<html lang="en">
<head>
    <script src="ASSETS/TOOL-FILES/JS/DEV-TOOL-PROTECTION-2.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="ASSETS/MAIN-FILE/IMG/LOGO/RX-3.png">
    <title>RX |USER-LOGIN</title>
    <link rel="stylesheet" href="ASSETS/WEB-SOFTWARE/CSS/USER-LOGIN.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <h1><i class="fas fa-user-shield"></i> Welcome</h1>
            <div class="login-options">
                <div class="option guest-option" onclick="loginAsGuest()">
                    <h2><i class="fas fa-user"></i> Guest Login</h2>
                    <p>Continue without credentials</p>
                </div>
                
                <div class="option user-option" id="userLoginOption">
                    <h2><i class="fas fa-sign-in-alt"></i> User Login</h2>
                    <form id="userLoginForm">
                        <input type="text" id="username" placeholder="Username" required>
                        <input type="password" id="password" placeholder="Password" required>
                        <button type="submit">Login</button>
                        <button type="button" onclick="window.location.href='index.html'">Back</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="ASSETS/WEB-SOFTWARE/JS/USER-LOGIN.js"></script>
    <script>
        document.getElementById('userLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            loginAsUser(username, password);
        });
    </script>
</body>
</html>
