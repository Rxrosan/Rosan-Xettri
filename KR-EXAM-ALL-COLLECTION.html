<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="ASSETS/TOOL-FILES/JS/DEV-TOOL-PROTECTION-2.js"></script>
    <link rel="icon" type="image/png" href="ASSETS/MAIN-FILE/IMG/LOGO/RX-3.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="ASSETS/KR-EXAM-FILES/KR-EXAM-LOGIN-FUNCTION/CSS/KR-EXAM-ALL-COLLECTION.css">
</head>
<body>
    <div id="app-root" style="display: none;">
        <header class="header">
            <h1>RX|QB</h1>
            <div class="header-actions">
                <button id="profile-btn" class="btn-header"><i class="fas fa-user"></i> My Profile</button>
                <button id="logout-btn" class="btn-header"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </header>
        
        <main class="container">
            <div class="filter-tabs">
                <button class="tab-btn active" data-filter="all">All Questions</button>
                <button class="tab-btn" data-filter="purchased">My Purchased Questions</button>
            </div>
            <div class="question-grid" id="question-grid">
                <!-- Questions will be loaded here by JavaScript -->
            </div>
        </main>

        <footer class="footer">
            <div class="footer-links">
                <a href="#" class="footer-link" id="privacy-policy-link">Privacy Policy</a>
                <a href="#" class="footer-link" id="terms-of-use-link">Terms of Use</a>
                <a href="#" class="footer-link" id="contact-us-link">Contact Us</a>
            </div>
            <p class="copyright">© 2024 Rosan Xettri Studio. All rights reserved.</p>
        </footer>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>User Profile</h2>
            <img id="profile-img" src="" alt="Profile Picture" style="width: 100px; height: 100px; border-radius: 50%; margin-bottom: 1rem; object-fit: cover;">
            <div class="profile-info">
                <p><strong>Name:</strong> <span id="profile-name"></span></p>
                <p><strong>Phone:</strong> <span id="profile-phone"></span></p>
                <p><strong>Key:</strong> <span id="profile-key"></span></p>
            </div>
            <button id="modal-close-btn" class="modal-close">Close</button>
        </div>
    </div>
    
    <script src="ASSETS/KR-EXAM-FILES/KR-EXAM-LOGIN-FUNCTION/JS/KR-EXAM-ALL-COLLECTION-LOGIN-MEMBER.js"></script>
    <script src="ASSETS/KR-EXAM-FILES/KR-EXAM-LOGIN-FUNCTION/JS/KR-EXAM-ALL-COLLECTION.js"></script>
</body>
</html>
