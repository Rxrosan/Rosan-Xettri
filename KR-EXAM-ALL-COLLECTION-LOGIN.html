<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="ASSETS/TOOL-FILES/JS/DEV-TOOL-PROTECTION-2.js"></script>
     <link rel="icon" type="image/png" href="ASSETS/MAIN-FILE/IMG/LOGO/RX-3.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RX Question Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="ASSETS/KR-EXAM-FILES/KR-EXAM-LOGIN-FUNCTION/CSS/KR-EXAM-ALL-COLLECTION-LOGIN.css">
   
</head>
<body>
    <div class="login-container">
        <h1>Rosan Xettri Studio</h1>
        <p>Please log in to access your question bank.</p>
        <form id="login-form">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" required>
            </div>
            <div class="form-group">
                <label for="key">Your Key</label>
                <input type="password" id="key" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
        <p id="error-message">Invalid phone number or key.</p>
    </div>

    <script src="ASSETS/KR-EXAM-FILES/KR-EXAM-LOGIN-FUNCTION/JS/KR-EXAM-ALL-COLLECTION-LOGIN-MEMBER.js"></script>
    <script src="ASSETS/KR-EXAM-FILES/KR-EXAM-LOGIN-FUNCTION/JS/KR-EXAM-ALL-COLLECTION-LOGIN.js"></script>
</body>
</html>
