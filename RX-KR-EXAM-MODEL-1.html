<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="RX-ASSETS/RX-OTHER-SOFTWARE-FUNCTION/RX-JS/RX-DEV-TOOL-PROTECTION-ALL.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" type="image/png" href="RX-ASSETS/RX-IMAGE/RX-LOGO/L-3.png">
    <title>RX | EPS-TOPIK UBT TRAIL EXAM</title>
    <link rel="stylesheet" href="RX-ASSETS/RX-EXAM-FILE/RX-KR-EXAM-MODEL-1-FILES/RX-EXAM-CSS/RX-EPS-MAIN.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#3498db">
    <meta name="msapplication-navbutton-color" content="#3498db">
    <meta name="apple-mobile-web-app-title" content="RX Exam">
</head>
<body>
     <!-- १. जाभास्क्रिप्ट बन्द गर्नेहरूलाई रोक्न यो कोड ठीक यहाँ हाल्नुहोस् -->
    <noscript>
        <div style="position:fixed; top:0; left:0; width:100%; height:100%; background-color:#ffffff; color:#ff0000; text-align:center; padding-top:15%; font-family:Arial, sans-serif; font-size:24px; font-weight:bold; z-index:999999;">
            <p>JavaScript is disabled in your browser!</p>
            <p style="color:#333333; font-size:18px; font-weight:normal; margin-top:10px;">
                Please enable JavaScript to view this website.
            </p>
        </div>
    </noscript>


    <header class="main-header">
        <div class="header-left">ROSAN XETTRI STUDIO</div>
        <div class="header-right">RX </div>
    </header>

    <div class="stats-bar">
        <span>Total Questions: 40</span>
        <span>Solved: <span id="solved-count">0</span></span>
        <span>Unsolved: <span id="unsolved-count">40</span></span>
        <span>Time Remaining: <span id="timer">50:00</span></span>
    </div>

    <main class="main-wrapper">
        <!-- GRID OVERVIEW SCREEN -->
        <div id="menuScreen" class="view-container">
            <div class="grid-dual-pane">
                <div class="grid-column">
                    <h3 class="pane-title">Reading Questions</h3>
                    <div id="readGrid" class="q-grid"></div>
                </div>
                <div class="grid-column">
                    <h3 class="pane-title">Listening Questions</h3>
                    <div id="listenGrid" class="q-grid"></div>
                </div>
            </div>
            <button class="btn-finish" onclick="ExamSubmit.submitExam()">SUBMIT AND FINISH EXAM</button>
        </div>

        <!-- INDEPENDENT SCROLL QUESTION SCREEN -->
        <div id="questionScreen" class="view-container" style="display:none">
            <div class="split-pane-container">
                <!-- LEFT SIDE SCROLLABLE -->
                <div class="pane left-pane" id="questionContent">
                   <!-- Questions will be injected here -->
                </div>

                <!-- RIGHT SIDE SCROLLABLE -->
                <div class="pane right-pane" id="optionsContainer">
                    <!-- Options will be injected here -->
                </div>
            </div>
        </div>
    </main>

   <footer id="navFooter" style="display: none; visibility: hidden;">
    <button class="nav-btn" onclick="QuestionNav.prevQ()"><span>❮ PREVIOUS</span></button>
    <button class="nav-btn" onclick="QuestionNav.toggleView()"><span>QUESTION MENU </span></button>
    <button class="nav-btn" onclick="QuestionNav.nextQ()"><span>NEXT ❯</span></button>
</footer>
    <script src="RX-ASSETS/RX-FUNCTION/RX-USER-DATA/RX-USER-DATA-JS/user.js"></script>
    <script src="RX-ASSETS/RX-EXAM-FILE/RX-KR-EXAM-MODEL-1-FILES/RX-EXAM-FUNCTION-JS/name-update.js"></script>
    <!-- Core Libraries - CRITICAL ORDER -->
    <script src="RX-ASSETS/RX-EXAM-FILE/RX-KR-EXAM-MODEL-1-FILES/RX-EXAM-FUNCTION-JS//user-state.js"></script>
    <script src="RX-ASSETS/RX-EXAM-FILE/RX-KR-EXAM-MODEL-1-FILES/RX-EXAM-FUNCTION-JS//media-helper.js"></script>
    <script src="RX-ASSETS/RX-EXAM-FILE/RX-KR-EXAM-MODEL-1-FILES/RX-EXAM-FUNCTION-JS//media-controller.js"></script>
    
    <!-- Questions Manager MUST load first -->
    <script src="RX-ASSETS/RX-FUNCTION/RX-UNIVERAL-FUNCTION/RX-JS/RX-ACESS.js"></script>
    
    <!-- Other modules -->
    <script src="RX-ASSETS/RX-EXAM-FILE/RX-KR-EXAM-MODEL-1-FILES/RX-EXAM-FUNCTION-JS//grid-renderer.js"></script>
    <script src="RX-ASSETS/RX-EXAM-FILE/RX-KR-EXAM-MODEL-1-FILES/RX-EXAM-FUNCTION-JS//question-loader.js"></script>
    <script src="RX-ASSETS/RX-EXAM-FILE/RX-KR-EXAM-MODEL-1-FILES/RX-EXAM-FUNCTION-JS//selection-handler.js"></script>
    <script src="RX-ASSETS/RX-EXAM-FILE/RX-KR-EXAM-MODEL-1-FILES/RX-EXAM-FUNCTION-JS//question-nav.js"></script>
    <script src="RX-ASSETS/RX-EXAM-FILE/RX-KR-EXAM-MODEL-1-FILES/RX-EXAM-FUNCTION-JS//timer.js"></script>
    <script src="RX-ASSETS/RX-EXAM-FILE/RX-KR-EXAM-MODEL-1-FILES/RX-EXAM-FUNCTION-JS//submit-handler.js"></script>
    <script src="RX-ASSETS/RX-EXAM-FILE/RX-KR-EXAM-MODEL-1-FILES/RX-EXAM-FUNCTION-JS//app-loader.js"></script> 
    <script src="RX-ASSETS/RX-EXAM-FILE/RX-KR-EXAM-MODEL-1-FILES/RX-EXAM-FUNCTION-JS//Exam-reviewer.js"></script> 
    
</body>
</html>
